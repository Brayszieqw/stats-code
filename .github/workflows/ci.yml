name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: TS Backend (typecheck + tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ts-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (embed templates/matrix + tsc)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test (unit + integration + property + parity)
        run: npm test

  web:
    name: Web Frontend (typecheck + tests + build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

  distribution:
    name: Distribution artifact (SEA + smoke)
    runs-on: windows-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ts-backend/package-lock.json
            web/package-lock.json

      - name: Build frontend (embedded into the exe)
        run: |
          npm ci
          npm run build
        working-directory: web

      - name: Build backend
        run: |
          npm ci
          npm run build
        working-directory: ts-backend

      - name: Install Chromium for browser E2E
        run: npx playwright install --only-shell chromium
        working-directory: web

      - name: Browser E2E (research gate)
        shell: pwsh
        run: .\scripts\run-web-e2e-ci.ps1

      - name: Upload browser E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stats-code-e2e-${{ github.sha }}
          path: |
            web/output/playwright/research-gate-demo/*
            web/output/playwright/ci/*
          if-no-files-found: warn
          retention-days: 7

      - name: Build single-file exe (Node SEA)
        run: npm run sea
        working-directory: ts-backend

      - name: Smoke test the artifact
        run: npm run smoke
        working-directory: ts-backend

      - name: Release metadata
        run: npm run release-meta -- --require-artifacts
        working-directory: ts-backend

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stats-code-windows-x64-${{ github.sha }}
          path: |
            ts-backend/build/stats-code.exe
            ts-backend/build/release/*
