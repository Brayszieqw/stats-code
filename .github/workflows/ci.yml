name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  validation:
    name: Numerical Validation
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: crates/stats-code/validation/requirements.txt

      - name: Install Python dependencies
        run: pip install -r crates/stats-code/validation/requirements.txt

      - name: Install R (survival package optional)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
        continue-on-error: true

      - name: Install R survival package
        run: Rscript -e "install.packages(c('survival','jsonlite'), repos='https://cloud.r-project.org')"
        continue-on-error: true

      - name: Build Stats Code CLI
        run: cargo build --release -p stats-code

      - name: Generate synthetic datasets
        run: python crates/stats-code/validation/datasets/_preprocess/gen_synthetic.py
        working-directory: ${{ github.workspace }}

      - name: Generate edge case datasets
        run: |
          python crates/stats-code/validation/datasets/_preprocess/gen_edge_logistic_perfect_separation.py
          python crates/stats-code/validation/datasets/_preprocess/gen_edge_survival_tied_times.py
          python crates/stats-code/validation/datasets/_preprocess/gen_edge_zero_variance_covariate.py
          python crates/stats-code/validation/datasets/_preprocess/gen_edge_single_obs_group.py
          python crates/stats-code/validation/datasets/_preprocess/gen_edge_collinear_predictors.py
        working-directory: ${{ github.workspace }}

      - name: Run validation test suite (unit + property + smoke)
        run: pytest crates/stats-code/validation/tests -v -m "not slow"
        working-directory: ${{ github.workspace }}

      - name: Run full numerical parity sweep
        run: python crates/stats-code/validation/run_validation.py --out crates/stats-code/validation/reports/
        working-directory: ${{ github.workspace }}

      - name: Upload Validation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ github.sha }}
          path: |
            crates/stats-code/validation/reports/report.json
            crates/stats-code/validation/reports/report.md

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Run coverage
        run: cargo tarpaulin --workspace --out xml --skip-clean
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          fail_ci_if_error: false
