name: Release Parity Assets

# Tag-triggered release pipeline that builds the CI Parity Suite and attaches
# the resulting report.json + report.html to the GitHub Release as assets,
# satisfying Requirement 3.5 of the parity-and-multilang-sidecar spec.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-parity:
    name: Build Parity Report and Attach to Release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-parity-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-parity-cargo-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: crates/stats-code/validation/requirements.txt

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Install Python dependencies
        run: pip install -r crates/stats-code/validation/requirements.txt

      - name: Build Stats Code (release)
        run: cargo build --release -p stats-code

      # run_validation.py owns the exit-code surface (Requirement 5.4 / 5.7 /
      # 12.6). For a tagged release we still want the assets uploaded even if
      # the suite reports failures, so the upload + attach steps below use
      # `if: always()`.
      - name: Run Parity Suite (emit report)
        run: python crates/stats-code/validation/run_validation.py --emit-report

      - name: Upload Parity Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-${{ github.ref_name }}
          path: |
            crates/stats-code/validation/reports/**/report.json
            crates/stats-code/validation/reports/**/report.html
          if-no-files-found: error

      # Attach report.json + report.html to the GitHub Release for the tag.
      # softprops/action-gh-release@v2 supports glob patterns in `files`.
      - name: Attach Parity Report to GitHub Release
        if: always() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crates/stats-code/validation/reports/**/report.json
            crates/stats-code/validation/reports/**/report.html
          fail_on_unmatched_files: true
