[workspace]
members = [
    "crates/api",
    "crates/stats-code",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
clap = "4"
serde = "1"
serde_json = "1"
tokio = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"
# Statistics code uses standard math variable names (i, j, k, n, x, y)
many_single_char_names = "allow"
# Statistics code intentionally compares floats for thresholds and convergence checks
float_cmp = "allow"
# Statistical constants like 0.5723649 are clearer without underscores
unreadable_literal = "allow"
# Status/config structs naturally have multiple bool flags
struct_excessive_bools = "allow"
# Helper functions defined close to use in complex algorithms
items_after_statements = "allow"
# clap Args types are passed by value by design
needless_pass_by_value = "allow"
