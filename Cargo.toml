[workspace]
members = [
    "crates/api",
    "crates/stats-code",
    "crates/agent-core",
    "crates/agent-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
clap = "4"
serde = "1"
serde_json = "1"
tokio = "1"

[workspace.lints.rust]
# `deny`（不是 `forbid`）允许特定模块通过 `#[allow(unsafe_code)]` 局部启用，
# `forbid` 则会硬阻止任何 allow 覆盖。Windows 平台的 `launcher::process_guard`
# 模块需要直接调用 Win32 Job Object FFI（`windows-sys`），必须能在受控位置
# 启用 unsafe；改用 `deny` 后未在显式 allow 的位置仍按错误处理，policy 等价。
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"
# Statistics code uses standard math variable names (i, j, k, n, x, y)
many_single_char_names = "allow"
# Statistics code intentionally compares floats for thresholds and convergence checks
float_cmp = "allow"
# Statistical constants like 0.5723649 are clearer without underscores
unreadable_literal = "allow"
# Status/config structs naturally have multiple bool flags
struct_excessive_bools = "allow"
# Helper functions defined close to use in complex algorithms
items_after_statements = "allow"
# clap Args types are passed by value by design
needless_pass_by_value = "allow"
