[package]
name = "agent-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "HTTP server (axum) for the Stats Web Platform agent"

[features]
# Default = prod 模式：通过 rust-embed 把 `web/dist/` 嵌入二进制并在 SPA
# fallback 中伺服（Requirement 6.2 / 6.3）。
# 开启 `dev-vite` 切换到 dev 模式：static_assets 模块整体被 cfg 排除，前端
# 请求由 launcher spawn 的 Vite_Dev_Server 处理，避免嵌入磁盘上可能不存在的
# `web/dist/` 触发编译错误。
default = []
dev-vite = []

[dependencies]
agent-core = { path = "../agent-core" }
api = { path = "../api" }
async-trait = "0.1"
axum = { version = "0.7", features = ["macros", "multipart"] }
base64 = "0.22"
bytes = "1"
# Requirement 6.1 / 6.2：编译期把 `web/dist/` 嵌入二进制供 SPA fallback 伺服。
# 与 stats-code crate 中的 rust-embed 版本对齐。dev-vite feature 开启时
# `handlers::static_assets` 模块被 cfg 排除，derive 不会触发，因此即便
# `web/dist/` 不存在也不会失败。
rust-embed = "8.5"
# 与 rust-embed 配合，根据文件后缀推断 Content-Type。
mime_guess = "2"
chrono = { version = "0.4", features = ["serde"] }
multer = "3"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"

[lints]
workspace = true
