schema_version: stats-code.v0

study:
  title: Preventive Medicine Demo Cohort
  design: cohort
  population: Adults enrolled in annual occupational health surveillance

study_context:
  estimand: 1-year marginal risk ratio
  exposure: Current smoking
  comparator: Never smoking
  outcome: Incident cardiometabolic disease
  time_zero: Annual surveillance visit date
  follow_up: 12 months after baseline visit
  censoring: Death, loss to follow-up, or end of study window
  missing_data_strategy: Multiple imputation for baseline covariates
  clustering: Study site
  sensitivity_analyses: Complete-case model and alternate smoking coding
  reporting_guideline: STROBE

data:
  path: data/demo_cohort.csv
  format: csv
  id_column: participant_id
  dictionary_path: data/demo_cohort.dictionary.csv
  encoding: utf-8

variables:
  - name: disease
    label: Incident cardiometabolic disease
    kind: binary
    roles: [outcome]
    coding:
      reference: "0"
      levels: ["0", "1"]
  - name: death
    label: All-cause death
    kind: event
    roles: [event]
  - name: fu_time
    label: Follow-up time in months
    kind: time
    roles: [time]
  - name: fu_pt
    label: Person-time in years
    kind: person_time
    roles: [time]
  - name: age
    label: Age at baseline
    kind: continuous
    roles: [covariate]
  - name: bmi
    label: Body mass index
    kind: continuous
    roles: [covariate]
  - name: smoke
    label: Current smoking
    kind: categorical
    roles: [exposure]
    coding:
      reference: never
      levels: [never, former, current]
  - name: sex
    label: Sex
    kind: categorical
    roles: [covariate, strata]
    coding:
      reference: female
      levels: [female, male]
  - name: site
    label: Study site
    kind: categorical
    roles: [cluster]
  - name: survey_weight
    label: Sampling weight
    kind: continuous
    roles: [weight]

survey:
  weight: survey_weight
  strata: site
  cluster: site
  variance_estimator: linearized
  combined_cycles: [2024, 2025]

privacy:
  deidentify: true
  direct_identifiers: [participant_id]
  quasi_identifiers: [age, sex, site]
  small_cell_threshold: 5

analyses:
  - id: inspect_main
    kind: inspect
  - id: table1_by_disease
    kind: table_one
    by: disease
  - id: rate_by_sex
    kind: rate
    event: disease
    person_time: fu_pt
    strata: [sex]
  - id: paired_ttest_age_bmi
    kind: ttest.paired
    before: age
    after: bmi
  - id: one_sample_ttest_age
    kind: ttest.one_sample
    var: age
    mu: 50
  - id: anova_age_by_smoke
    kind: anova.oneway
    var: age
    group: smoke
  - id: trend_smoke_disease
    kind: nonparam.cochran_armitage
    exposure: smoke
    outcome: disease
    scores: [2, 1, 0]
  - id: mcnemar_disease_death
    kind: nonparam.mcnemar
    var1: disease
    var2: death
  - id: wilcoxon_age_bmi
    kind: nonparam.wilcoxon
    var1: age
    var2: bmi
  - id: mannwhitney_age_by_sex
    kind: nonparam.mannwhitney
    var: age
    group: sex
  - id: correlation_age_bmi
    kind: correlation
    x: age
    y: bmi
    method: pearson
  - id: stratified_or_rr
    kind: epi.or_rr
    exposure: sex
    exposure_event: male
    outcome: disease
    strata: [site]
  - id: direct_standardize_by_site
    kind: epi.standardize
    method: direct
    event: disease
    person_time: fu_pt
    age_group: site
    standard_pop: data/demo_standard_pop.csv
  - id: attributable_death_disease
    kind: epi.attributable
    exposure: death
    outcome: disease
    person_time: fu_pt
  - id: normality_age
    kind: diagnostic.normality
    var: age
  - id: variance_age_by_sex
    kind: diagnostic.variance
    var: age
    group: sex
    center: median
  - id: lifetable_death
    kind: survival.lifetable
    input_format: individual
    time: fu_time
    status: death
    intervals: width=3
  - id: logistic_main
    kind: model
    model: logistic
    outcome: disease
    predictors: [age, bmi, smoke]
    adjust: [sex, site]
  - id: cox_main
    kind: model
    model: cox
    time: fu_time
    event: death
    predictors: [age, bmi, smoke]
    adjust: [sex, site]

report:
  out_dir: stats-code-artifacts
  include_methods: true
  include_tables: true
  include_assumptions: true

audit:
  log_dir: stats-code-artifacts/audit
  save_commands: true
  save_inputs: true
  save_outputs: true
  save_environment: true
  save_decisions: true
