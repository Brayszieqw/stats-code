# Tolerance configuration for the Validation Correctness Framework.
#
# Lookup priority: "method.metric" > "method" > default
#
# Rationale summary (see design.md "容差决策表" for full justification):
#   - Closed-form methods (linear, KM, rate, math_core): 1e-8 or tighter
#   - Iterative methods (logistic, Cox): 1e-5 to 1e-4 (IRLS / Newton-Raphson convergence)
#   - CDF-derived p-values: 1e-6 (CDF algorithm differences across libraries)
#   - Integer / exact quantities: 0.0

default: 1.0e-6

per_metric:
  # ── Linear regression (QR/SVD closed-form) ──────────────────────────────
  linear.beta: 1.0e-8          # QR/SVD closed-form; double precision ~2.2e-16
  linear.stderr: 1.0e-8        # derived from beta via closed-form formula
  linear.t_stat: 1.0e-6        # depends on t_cdf implementation
  linear.pvalue: 1.0e-6        # depends on t_cdf implementation
  linear.r_squared: 1.0e-8     # closed-form from beta
  linear.adj_r_squared: 1.0e-8 # closed-form from r_squared
  linear.f_stat: 1.0e-6        # depends on F_cdf implementation
  linear.f_pvalue: 1.0e-6      # depends on F_cdf implementation

  # ── Logistic regression (Newton-Raphson / IRLS iterative) ───────────────
  logistic.beta: 1.0e-5          # IRLS convergence tolerance ~1e-8; cross-engine diff ~1e-5
  logistic.stderr: 1.0e-5        # Hessian numerical inverse; sensitive to beta perturbation
  logistic.wald: 1.0e-5          # beta / stderr ratio
  logistic.pvalue: 1.0e-5        # depends on normal_cdf and beta
  logistic.odds_ratio: 1.0e-5    # exp(beta); relative 1e-5
  logistic.log_likelihood: 1.0e-5 # iterative accumulation
  logistic.c_statistic: 1.0e-6   # AUC from predicted probabilities; numerically stable
  logistic.nagelkerke_r2: 1.0e-5 # derived from log_likelihood

  # ── Cox proportional hazards (partial likelihood iterative + tie handling) ─
  # Stats Code and lifelines both default to the Efron tie-handling
  # approximation, so log_partial_likelihood can be held to the same 1e-4
  # budget as the other Cox metrics (Newton-Raphson convergence dominates).
  cox.beta: 1.0e-4               # Cox PLE + Efron tie handling; cross-engine diff ~1e-4
  cox.stderr: 1.0e-4             # same as beta
  cox.hazard_ratio: 1.0e-4       # exp(beta)
  cox.pvalue: 1.0e-4             # depends on beta and normal_cdf
  cox.log_partial_likelihood: 1.0e-4 # Efron on both sides; matches other Cox metrics
  cox.concordance: 1.0e-4        # discrete rank statistic; small variation with tie handling

  # ── Kaplan–Meier (closed-form product-limit estimator) ──────────────────
  km.survival_probability: 1.0e-8 # closed-form product; exact
  km.greenwood_se: 1.0e-8         # closed-form cumulative sum
  km.median_survival: 1.0e-8      # linear interpolation
  km.logrank_chi2: 1.0e-6         # depends on chi2_cdf
  km.logrank_p: 1.0e-6            # depends on chi2_cdf

  # ── Incidence rate (simple division + Byar chi2 quantile) ───────────────
  rate.estimate_per_1000: 1.0e-10 # simple division; should be exact
  rate.byar_ci_lower: 1.0e-8      # chi2 quantile closed-form
  rate.byar_ci_upper: 1.0e-8      # chi2 quantile closed-form

  # ── Sample size / power (normal_cdf-based) ──────────────────────────────
  power.required_n: 0.0           # integer ceiling; must match exactly
  power.achieved_power: 1.0e-6    # depends on normal_cdf

  # ── Math core (CDF functions — same underlying algorithm as scipy) ───────
  math_core.normal_cdf: 1.0e-10      # same algorithm family as scipy; 6+ significant digits
  math_core.chi_square_cdf: 1.0e-10  # same
  math_core.t_cdf: 1.0e-10           # same
  math_core.f_cdf: 1.0e-10           # same
  math_core.fisher_exact_pvalue: 1.0e-12 # pure combinatorics; should be exact

  # ── Table One (descriptive statistics) ──────────────────────────────────
  tableone.mean: 1.0e-10      # closed-form sum / n
  tableone.std: 1.0e-10       # closed-form
  tableone.median: 1.0e-10    # closed-form sort + interpolation
  tableone.q1: 1.0e-10        # closed-form
  tableone.q3: 1.0e-10        # closed-form
  tableone.count: 0.0         # integer; must match exactly
  tableone.proportion: 0.0    # rational number; must match exactly
  tableone.t_stat: 1.0e-8     # closed-form
  tableone.chi2_stat: 1.0e-8  # closed-form
  tableone.kw_stat: 1.0e-8    # closed-form
  tableone.pvalue: 1.0e-6     # depends on CDF

  # ── Diagnostic ROC ──────────────────────────────────────────────────────
  diagnostic_roc.auc: 1.0e-8              # trapezoidal integration; closed-form
  diagnostic_roc.sensitivity: 1.0e-10    # count ratio; exact
  diagnostic_roc.specificity: 1.0e-10    # count ratio; exact
