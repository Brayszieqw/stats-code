name: ts-backend-ci

# CI skeleton for the TypeScript backend (Phase 0, task 1.1).
# Phase 8 (task 17.1) wires the full parity gate; this skeleton establishes the
# stage order: install → typecheck → lint → test → (parity, gated).

on:
  push:
    paths:
      - 'ts-backend/**'
  pull_request:
    paths:
      - 'ts-backend/**'

defaults:
  run:
    working-directory: ts-backend

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:property
      # Parity suite runs as a gated job at the Phase 8 cutover (task 17.1).
      # - run: npm run test:parity
