name: ts-backend-ci

# PACKAGE-LOCAL SKELETON — NOT auto-executed by GitHub Actions.
# GitHub only loads workflows from the monorepo root:
#   .github/workflows/ci.yml  (repo root; job "backend")
# Keep this file as documentation of the intended stage order for the
# TypeScript backend package. When changing CI behavior, edit the root
# workflow first; mirror order here only for discoverability.
#
# Stage order: install → build → typecheck → lint → test → (parity, gated).
# Phase 8 (task 17.1) wires the full parity gate.

on:
  push:
    paths:
      - 'ts-backend/**'
  pull_request:
    paths:
      - 'ts-backend/**'

defaults:
  run:
    working-directory: ts-backend

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      # vitest globalSetup runs ensure-built (skip when dist is fresh after build).
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:property
      # Full Parity_Validator gate at the Phase 8 cutover (task 17.1). A
      # non-zero exit (FAIL_ROW=2 / UNKNOWN_FILTER=3 / MISSING_TOLERANCE=4 /
      # MATRIX_CONTRADICTION=5) fails the build.
      - run: npm run parity
