### Algorithm Coverage Matrix
###
### Single source of truth for which Output-Level Algorithms have parity
### coverage in which Reference Software, and which designated Reference
### Implementation is the parity ground truth for each cell.
###
### Transcribed verbatim from crates/stats-code/src/coverage_matrix/matrix.toml.
### `release_version` is a placeholder replaced at load time with the engine
### package version (mirrors the Rust build.rs CARGO_PKG_VERSION injection).
###
### Coverage values (Requirement 5.4):
###   live          -- Live Reference Suite executes the Reference
###                    Implementation in process and asserts parity.
###   recorded      -- Recorded Reference Suite asserts parity against a
###                    Known-Values Table.
###   sidecar_only  -- Sidecar Code Generator emits a snippet but no
###                    automated parity assertion exists.
###   none          -- No Sidecar snippet, no parity assertion.

schema_version = 1
release_version = "0.0.0-build-injected"

# ---------------------------------------------------------------------------
# Table One
# ---------------------------------------------------------------------------
[[algorithm]]
id = "tableone"
display_name = "Table One"
iterative = false
[algorithm.coverage]
R = "live"
SAS = "recorded"
Python = "live"
SPSS = "recorded"
[algorithm.reference]
R      = { fn = "tableone::CreateTableOne", pkg = "tableone", version = "0.13.2" }
SAS    = { proc = "PROC FREQ;PROC MEANS", version = "9.4M8" }
Python = { fn = "scipy.stats.ttest_ind",   pkg = "scipy",    version = "1.13.0" }
SPSS   = { proc = "FREQUENCIES;DESCRIPTIVES", version = "29.0.1" }

